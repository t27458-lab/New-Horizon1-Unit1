<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>英語バトル ⚔️ NH1 Unit1</title>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;user-select:none;-webkit-tap-highlight-color:transparent;}
body{font-family:'Hiragino Sans','Noto Sans JP',sans-serif;background:#0f172a;color:#e2e8f0;
  min-height:100vh;display:flex;align-items:center;justify-content:center;}

/* ── SCREENS ── */
.screen{display:none;width:100%;max-width:480px;min-height:100vh;
  flex-direction:column;align-items:center;justify-content:center;
  padding:24px 20px;gap:16px;text-align:center;}
.screen.active{display:flex;}
#s-game{justify-content:flex-start;padding:0;max-width:100%;gap:0;}

/* ── COMMON ── */
h1{font-size:28px;font-weight:900;color:#fbbf24;line-height:1.3;}
h2{font-size:20px;font-weight:bold;color:#7dd3fc;}
.sub{font-size:13px;color:#64748b;}
.btn{width:100%;max-width:280px;padding:15px;font-size:17px;font-weight:bold;border:none;
  border-radius:14px;cursor:pointer;transition:opacity .15s,transform .1s;}
.btn:active{opacity:.75;transform:scale(.97);}
.btn:disabled{opacity:.4;cursor:default;transform:none;}
.btn-yellow{background:linear-gradient(135deg,#f59e0b,#d97706);color:#1a1a2e;}
.btn-blue{background:#3b82f6;color:#fff;}
.btn-slate{background:#334155;color:#e2e8f0;}
.btn-green{background:#22c55e;color:#fff;}

/* ── LEVEL CARDS ── */
.level-cards{display:flex;flex-direction:column;gap:10px;width:100%;max-width:360px;}
.level-card{border:none;border-radius:16px;padding:14px 18px;cursor:pointer;
  text-align:left;font-family:inherit;transition:transform .15s;display:flex;align-items:center;gap:12px;}
.level-card:active{transform:scale(.96);}
.level-card.easy  {background:linear-gradient(135deg,#1e40af,#3b82f6);}
.level-card.medium{background:linear-gradient(135deg,#5b21b6,#8b5cf6);}
.level-card.hard  {background:linear-gradient(135deg,#991b1b,#ef4444);}
.lc-icon{font-size:2rem;flex-shrink:0;}
.lc-name{font-size:1.1rem;font-weight:bold;color:#fff;}
.lc-desc{font-size:.75rem;color:rgba(255,255,255,.8);margin-top:2px;}

/* ── CONNECTION ── */
.code-box{background:#1e293b;border:2px solid #3b82f6;border-radius:16px;
  padding:20px 48px;font-size:52px;font-weight:bold;letter-spacing:10px;color:#7dd3fc;}
.code-input{background:#1e293b;border:2px solid #3b82f6;border-radius:12px;
  padding:14px;font-size:36px;color:#fff;text-align:center;width:180px;letter-spacing:8px;}
.code-input:focus{outline:none;border-color:#60a5fa;}
.status-wrap{display:flex;align-items:center;gap:8px;color:#94a3b8;font-size:14px;}
.dot{width:10px;height:10px;border-radius:50%;background:#f59e0b;flex-shrink:0;animation:blink 1s infinite;}
.dot.green{background:#22c55e;animation:none;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.2}}
.err{color:#f87171;font-size:13px;min-height:18px;}

/* ── HP ROW ── */
.hp-row{width:100%;display:flex;justify-content:space-between;align-items:center;
  padding:10px 14px 6px;background:rgba(0,0,0,.6);}
.hp-block{display:flex;flex-direction:column;align-items:flex-start;gap:1px;}
.hp-block.right{align-items:flex-end;}
.hp-name{font-size:11px;color:#64748b;font-weight:bold;letter-spacing:.03em;}
.hp-name.me{color:#fbbf24;}
.hp-hearts{font-size:20px;letter-spacing:2px;}
.q-counter{font-size:12px;color:#475569;font-weight:bold;}

/* ── TIMER BAR ── */
.timer-wrap{width:100%;height:6px;background:#1e293b;}
#timer-bar{height:100%;background:#3b82f6;width:100%;transform-origin:left;}
#timer-bar.running{animation:timerDrain var(--dur,15s) linear forwards;}
@keyframes timerDrain{from{width:100%}to{width:0%}}

/* ── STATUS BANNER ── */
.status-banner{width:100%;padding:8px 14px;text-align:center;font-size:14px;font-weight:bold;
  background:#1e293b;color:#94a3b8;min-height:36px;display:flex;align-items:center;justify-content:center;}
.status-banner.attack {background:#14532d;color:#86efac;}
.status-banner.damage {background:#450a0a;color:#fca5a5;}
.status-banner.timeout{background:#451a03;color:#fcd34d;}
.status-banner.wait   {background:#0f172a;color:#475569;}

/* ── CMD & Q ── */
.cmd-area{width:100%;padding:6px 14px 4px;text-align:center;}
.cmd-type{font-size:10px;color:#64748b;font-weight:bold;letter-spacing:.15em;margin-bottom:1px;}
.cmd-text{font-size:24px;font-weight:900;color:#fbbf24;}
.q-box{margin:0 12px 0;padding:12px 16px;border-radius:12px;
  background:rgba(255,255,255,.08);border-left:5px solid #fbbf24;
  font-size:16px;font-weight:bold;line-height:1.6;color:#fff;}
.q-hint{padding:3px 14px 0;font-size:12px;color:#475569;}

/* ── ANSWER ZONE ── */
.answer-zone{width:100%;padding:10px 12px;flex:1;display:flex;flex-direction:column;gap:8px;overflow:hidden;}

/* Choice */
.choices-grid{display:grid;gap:8px;}
.cbtn{padding:13px 14px;background:rgba(255,255,255,.92);border:2.5px solid transparent;
  border-radius:12px;font-size:15px;font-weight:bold;color:#111;cursor:pointer;
  text-align:left;font-family:inherit;transition:transform .1s;}
.cbtn:active:not([disabled]){transform:scale(.97);}
.cbtn.ok{background:#d1fae5;border-color:#059669;color:#064e3b;}
.cbtn.ng{background:#fee2e2;border-color:#ef4444;color:#7f1d1d;}
.cbtn[disabled]{cursor:default;}

/* TF */
.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tfbtn{padding:20px 8px;border:3px solid rgba(255,255,255,.25);border-radius:18px;
  font-size:3rem;text-align:center;cursor:pointer;background:rgba(255,255,255,.08);
  color:#fff;transition:transform .1s;}
.tfbtn:active{transform:scale(.93);}
.tfbtn.ok{background:rgba(16,185,129,.25);border-color:#10b981;}
.tfbtn.ng{background:rgba(239,68,68,.25);border-color:#ef4444;}

/* Build zone (Arrange + Spell) */
.build-zone{display:flex;flex-direction:column;gap:8px;}
.build-ans{min-height:52px;padding:8px;background:rgba(255,255,255,.07);
  border:2px dashed #334155;border-radius:10px;
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;position:relative;}
.build-pool{display:flex;flex-wrap:wrap;gap:6px;}
.build-placeholder{color:#334155;font-size:13px;}
.wbtn,.lbtn{padding:8px 13px;background:rgba(255,255,255,.9);border:2px solid transparent;
  border-radius:8px;font-size:15px;font-weight:bold;color:#111;cursor:pointer;
  font-family:inherit;transition:transform .1s;}
.lbtn{width:42px;height:42px;padding:0;display:flex;align-items:center;justify-content:center;font-size:16px;}
.wbtn:active:not([disabled]),.lbtn:active:not([disabled]){transform:scale(.93);}
.wbtn.placed,.lbtn.placed{background:#dbeafe;border-color:#3b82f6;color:#1e40af;}
.wbtn[disabled],.lbtn[disabled]{opacity:.2;cursor:default;transform:none;}
.check-btn{align-self:center;padding:10px 28px;background:rgba(255,255,255,.9);border:none;
  border-radius:50px;font-size:14px;font-weight:900;color:#111;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.check-btn:disabled{opacity:.35;cursor:default;}
.check-btn:active:not([disabled]){opacity:.7;}
.wrong-shake{animation:wshake .35s ease-out;}
@keyframes wshake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}
  40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}

/* ── RESULT ── */
#s-result{gap:14px;}
.result-emoji{font-size:72px;}

/* ── FLASH ── */
#flash-ol{position:fixed;inset:0;pointer-events:none;z-index:999;opacity:0;}
</style>
</head>
<body>

<!-- ① タイトル / レベル選択 -->
<div class="screen active" id="s-title">
  <h1>英語バトル ⚔️<br>NH1 Unit1</h1>
  <p class="sub">2人対戦 — 先に正解した方が攻撃！</p>
  <div class="level-cards">
    <button class="level-card easy" onclick="selectLevel('easy')">
      <div class="lc-icon">🌱</div>
      <div><div class="lc-name">初級編</div><div class="lc-desc">単語・be動詞・スペル並べ替え</div></div>
    </button>
    <button class="level-card medium" onclick="selectLevel('medium')">
      <div class="lc-icon">🔥</div>
      <div><div class="lc-name">中級編</div><div class="lc-desc">一般動詞・語順並べ替え・対話</div></div>
    </button>
    <button class="level-card hard" onclick="selectLevel('hard')">
      <div class="lc-icon">💥</div>
      <div><div class="lc-name">上級編</div><div class="lc-desc">He/She・日本語→英語</div></div>
    </button>
  </div>
</div>

<!-- ② ロール選択 -->
<div class="screen" id="s-role">
  <h2 id="role-lv-label">初級編 選択中</h2>
  <p class="sub">どちらのiPadですか？</p>
  <button class="btn btn-blue"  onclick="selectRole('p1')">P1 ： ルームを作る</button>
  <button class="btn btn-slate" onclick="selectRole('p2')">P2 ： コードを入力</button>
  <button class="btn btn-slate" style="font-size:13px;padding:10px;max-width:200px;margin-top:4px"
    onclick="showScreen('s-title')">← レベル選択へ</button>
</div>

<!-- ③ P1：コード表示 -->
<div class="screen" id="s-host">
  <h2>ルームコード</h2>
  <div class="code-box" id="code-display">----</div>
  <div class="status-wrap"><div class="dot" id="host-dot"></div><span id="host-status">接続中...</span></div>
  <p class="err" id="host-err"></p>
  <button class="btn btn-slate" style="font-size:13px;padding:10px;max-width:200px" onclick="location.reload()">やり直す</button>
</div>

<!-- ④ P2：コード入力 -->
<div class="screen" id="s-join">
  <h2>コードを入力</h2>
  <input class="code-input" id="code-input" type="text" inputmode="numeric" maxlength="4" placeholder="----">
  <button class="btn btn-blue" id="join-btn" onclick="joinRoom()">接続する</button>
  <div class="status-wrap" style="justify-content:center" id="join-sw" hidden>
    <div class="dot" id="join-dot"></div><span id="join-status"></span>
  </div>
  <p class="err" id="join-err"></p>
  <button class="btn btn-slate" style="font-size:13px;padding:10px;max-width:200px;display:none" id="retry-btn" onclick="location.reload()">やり直す</button>
</div>

<!-- ⑤ ゲーム -->
<div class="screen" id="s-game">
  <div class="hp-row">
    <div class="hp-block">
      <div class="hp-name" id="hp-p1-name">P1</div>
      <div class="hp-hearts" id="hearts-p1">❤️❤️❤️❤️❤️</div>
    </div>
    <div class="q-counter" id="q-counter">Q1/10</div>
    <div class="hp-block right">
      <div class="hp-name" id="hp-p2-name">P2</div>
      <div class="hp-hearts" id="hearts-p2">❤️❤️❤️❤️❤️</div>
    </div>
  </div>
  <div class="timer-wrap"><div id="timer-bar"></div></div>
  <div class="status-banner" id="status-banner">⚔️ 先に正解した方が攻撃！</div>
  <div class="cmd-area">
    <div class="cmd-type" id="cmd-type">CHOOSE</div>
    <div class="cmd-text" id="cmd-text">選べ！</div>
  </div>
  <div class="q-box"  id="q-box"></div>
  <div class="q-hint" id="q-hint"></div>
  <div class="answer-zone">

    <!-- Choice -->
    <div id="zone-choice" style="display:none">
      <div class="choices-grid" id="choices-grid"></div>
    </div>

    <!-- TF -->
    <div id="zone-tf" style="display:none">
      <div class="tf-grid">
        <button class="tfbtn" id="tf-true">⭕</button>
        <button class="tfbtn" id="tf-false">❌</button>
      </div>
    </div>

    <!-- Arrange -->
    <div id="zone-arr" style="display:none">
      <div class="build-zone">
        <div class="build-ans" id="arr-ans"></div>
        <div class="build-pool" id="arr-pool"></div>
        <button class="check-btn" id="arr-check" disabled onclick="submitArr()">確認 ✓</button>
      </div>
    </div>

    <!-- Spell -->
    <div id="zone-spell" style="display:none">
      <div class="build-zone">
        <div class="build-ans" id="spell-ans"></div>
        <div class="build-pool" id="spell-pool"></div>
        <button class="check-btn" id="spell-check" disabled onclick="submitSpell()">確認 ✓</button>
      </div>
    </div>

  </div>
</div>

<!-- ⑥ リザルト -->
<div class="screen" id="s-result">
  <div class="result-emoji" id="r-emoji">🎉</div>
  <h2 id="r-title"></h2>
  <p id="r-detail" style="font-size:15px;color:#e2e8f0;margin:6px 0;"></p>
  <p id="r-msg"  class="sub"></p>
  <button class="btn btn-yellow" onclick="location.reload()">もう一度</button>
</div>

<div id="flash-ol"></div>

// ═══════════════════════════════════════════════════════
//  Constants & Config
// ═══════════════════════════════════════════════════════
const SUPPORTED = new Set(['vocab','fill','tf','translate','dialog','arrange','spell']);
const MAX_HP    = 5;
const MAX_Q     = 10;
const TIME_LIMIT = 15; // seconds

const TYPE_META = {
  vocab:    { cmd:'選べ！',   en:'CHOOSE',    zone:'choice' },
  fill:     { cmd:'入れろ！', en:'FILL IN',   zone:'choice' },
  tf:       { cmd:'◯か✗か！', en:'T or F',   zone:'tf'     },
  translate:{ cmd:'訳せ！',   en:'TRANSLATE', zone:'choice' },
  dialog:   { cmd:'答えろ！', en:'RESPOND',   zone:'choice' },
  arrange:  { cmd:'並べろ！', en:'ARRANGE',   zone:'arr'    },
  spell:    { cmd:'スペル！', en:'SPELL',     zone:'spell'  },
};

// ═══════════════════════════════════════════════════════
//  State
// ═══════════════════════════════════════════════════════
let db = null, gsRef = null, roundRef = null;
let myRole = null, roomCode = null, selectedLevel = 'easy';
let timeoutId  = null;
let skipNextGs = false;  // suppress echo after own write
let answered   = false;  // have I answered this round?

// game state (synced via Firebase; P1 is authoritative writer)
let gs = {
  phase:      'waiting',  // 'waiting'|'question'|'roundEnd'|'finished'
  level:      'easy',
  qIdxList:   [],         // shuffled indices into battleQ array
  currentQ:   0,
  p1hp:       MAX_HP,
  p2hp:       MAX_HP,
  roundWinner: null,      // null|'p1'|'p2'|'timeout'
};

// local answer-building state (NOT synced)
let arrState   = { items: [], pool: [] };  // {word,poolIdx}
let spellState = { items: [], pool: [] };  // {letter,poolIdx}

// ═══════════════════════════════════════════════════════
//  Utilities
// ═══════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function toArray(v) {
  if (!v) return [];
  return Array.isArray(v) ? v : Object.values(v);
}
function normStr(s) {
  return s.toLowerCase().replace(/[.?!,]/g,'').replace(/\s+/g,' ').trim();
}
function getBQ(level) {
  const src = level === 'easy' ? EASY_Q : level === 'medium' ? MEDIUM_Q : HARD_Q;
  return src.filter(q => SUPPORTED.has(q.t));
}
function currentQ() {
  return getBQ(gs.level)[gs.qIdxList[gs.currentQ]];
}
function setStatus(txt, cls) {
  const el = document.getElementById('status-banner');
  el.textContent = txt;
  el.className = 'status-banner' + (cls ? ' ' + cls : '');
}
function flashScreen(color) {
  const el = document.getElementById('flash-ol');
  el.style.background = color;
  el.style.opacity = '0.5';
  el.style.transition = '';
  setTimeout(() => {
    el.style.transition = 'opacity 350ms';
    el.style.opacity = '0';
    setTimeout(() => el.style.transition = '', 400);
  }, 60);
}
function disableAllInputs() {
  document.querySelectorAll('.cbtn,.tfbtn,.wbtn,.lbtn,.check-btn')
    .forEach(b => b.disabled = true);
}

// ═══════════════════════════════════════════════════════
//  Level / Role selection
// ═══════════════════════════════════════════════════════
function selectLevel(level) {
  selectedLevel = level;
  const labels = { easy:'🌱 初級編', medium:'🔥 中級編', hard:'💥 上級編' };
  document.getElementById('role-lv-label').textContent = labels[level] + ' 選択中';
  showScreen('s-role');
}

function selectRole(role) {
  myRole = role;
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
  if (role === 'p1') { showScreen('s-host'); hostRoom(); }
  else               { showScreen('s-join'); }
}

// ═══════════════════════════════════════════════════════
//  Connection — P1
// ═══════════════════════════════════════════════════════
function hostRoom() {
  const code = String(Math.floor(1000 + Math.random() * 9000));
  roomCode = code;
  document.getElementById('code-display').textContent = code;
  document.getElementById('host-status').textContent  = 'サーバーに接続中...';

  const roomRef = db.ref('rooms/' + code);
  gsRef    = roomRef.child('gs');
  roundRef = roomRef.child('round');
  roomRef.onDisconnect().remove();

  const bq = getBQ(selectedLevel);
  const idxList = shuffle(bq.map((_,i) => i)).slice(0, Math.min(MAX_Q, bq.length));
  gs = { phase:'waiting', level:selectedLevel, qIdxList:idxList,
         currentQ:0, p1hp:MAX_HP, p2hp:MAX_HP, roundWinner:null };

  gsRef.set(gs)
    .then(() => { document.getElementById('host-status').textContent = 'P2の接続を待っています...'; })
    .catch(e => { document.getElementById('host-err').textContent = 'エラー: ' + e.message; });

  roomRef.child('p2joined').on('value', snap => {
    if (snap.val() !== true) return;
    roomRef.child('p2joined').off();
    document.getElementById('host-dot').classList.add('green');
    document.getElementById('host-status').textContent = '✅ P2が接続しました！';
    setTimeout(startGameP1, 800);
  });
}

function startGameP1() {
  showScreen('s-game');
  listenGs();
  listenRound();
  pushGs({ ...gs, phase:'question', currentQ:0, roundWinner:null });
  renderHPs();
  renderQuestion();
  startTimerBar();
  startTimeoutTimer();
}

// ═══════════════════════════════════════════════════════
//  Connection — P2
// ═══════════════════════════════════════════════════════
function joinRoom() {
  const code = document.getElementById('code-input').value.trim();
  if (code.length !== 4) { document.getElementById('join-err').textContent = '4桁のコードを入力してください'; return; }
  document.getElementById('join-btn').disabled = true;
  document.getElementById('join-err').textContent = '';
  document.getElementById('join-sw').hidden = false;
  document.getElementById('join-status').textContent = 'ルームを確認中...';

  roomCode = code;
  const roomRef = db.ref('rooms/' + code);
  gsRef    = roomRef.child('gs');
  roundRef = roomRef.child('round');

  gsRef.once('value').then(snap => {
    if (!snap.exists()) {
      document.getElementById('join-err').textContent = 'ルームが見つかりません。コードを確認してください。';
      document.getElementById('join-sw').hidden = true;
      document.getElementById('join-btn').disabled = false;
      document.getElementById('retry-btn').style.display = 'block';
      return;
    }
    const raw = snap.val();
    gs = { ...raw, qIdxList: toArray(raw.qIdxList) };
    selectedLevel = gs.level;
    document.getElementById('join-dot').classList.add('green');
    document.getElementById('join-status').textContent = '✅ 接続完了！';
    roomRef.child('p2joined').set(true);
    setTimeout(() => {
      showScreen('s-game');
      listenGs();
      listenRound();
      renderHPs();
    }, 400);
  }).catch(e => {
    document.getElementById('join-err').textContent = 'エラー: ' + e.message;
    document.getElementById('join-sw').hidden = true;
    document.getElementById('join-btn').disabled = false;
    document.getElementById('retry-btn').style.display = 'block';
  });
}

// ═══════════════════════════════════════════════════════
//  Firebase helpers
// ═══════════════════════════════════════════════════════
function pushGs(newGs) {
  gs = newGs;
  skipNextGs = true;
  gsRef.set(gs);
}

function listenGs() {
  gsRef.on('value', snap => {
    if (!snap.exists()) return;
    if (skipNextGs) { skipNextGs = false; return; }
    const raw = snap.val();
    gs = { ...raw, qIdxList: toArray(raw.qIdxList) };
    renderHPs();

    if (gs.phase === 'question') {
      renderQuestion();
      startTimerBar();
      if (myRole === 'p1') startTimeoutTimer();
    } else if (gs.phase === 'roundEnd') {
      onRoundEnd();
    } else if (gs.phase === 'finished') {
      showResult();
    }
  });
}

// P1 listens to round claims, calculates HP, advances
function listenRound() {
  roundRef.on('value', snap => {
    if (!snap.exists() || !snap.val()) return;
    if (myRole !== 'p1') return;
    const round = snap.val();
    if (round.qIdx !== gs.currentQ) return;

    clearTimeout(timeoutId);

    const winner = round.winner;
    const newGs = { ...gs };
    if      (winner === 'p1')      newGs.p2hp = Math.max(0, gs.p2hp - 1);
    else if (winner === 'p2')      newGs.p1hp = Math.max(0, gs.p1hp - 1);
    else if (winner === 'timeout') {
      newGs.p1hp = Math.max(0, gs.p1hp - 1);
      newGs.p2hp = Math.max(0, gs.p2hp - 1);
    }
    newGs.roundWinner = winner;
    newGs.phase = 'roundEnd';
    pushGs(newGs);

    // Advance after 2.5s
    setTimeout(() => {
      roundRef.set(null);
      const nextQ = gs.currentQ + 1;
      const total = Math.min(MAX_Q, gs.qIdxList.length);
      if (nextQ >= total || gs.p1hp <= 0 || gs.p2hp <= 0) {
        pushGs({ ...gs, phase:'finished' });
      } else {
        pushGs({ ...gs, phase:'question', currentQ:nextQ, roundWinner:null });
        renderQuestion();
        startTimerBar();
        startTimeoutTimer();
      }
    }, 2500);
  });
}

// ─── Claim the round (transaction — only first correct answer wins) ───
function claimRound() {
  const qIdx = gs.currentQ;
  roundRef.transaction(current => {
    if (current == null || current.qIdx !== qIdx) {
      return { winner: myRole, qIdx, ts: firebase.database.ServerValue.TIMESTAMP };
    }
    return undefined; // abort — someone beat me
  }).then(result => {
    if (result.committed) {
      // Optimistic feedback
      setStatus('🎯 正解！攻撃中...', 'attack');
      flashScreen('rgba(34,197,94,.4)');
    }
  });
}

// ─── Round ended (phase=roundEnd in gs) ───
function onRoundEnd() {
  clearTimeout(timeoutId);
  document.getElementById('timer-bar').className = '';
  disableAllInputs();

  const winner = gs.roundWinner;
  if (winner === myRole) {
    setStatus('🎯 正解！攻撃成功！+1ダメージ', 'attack');
    flashScreen('rgba(34,197,94,.4)');
  } else if (winner === 'timeout') {
    setStatus('⏰ 時間切れ！お互い -1HP', 'timeout');
    flashScreen('rgba(245,158,11,.35)');
  } else {
    setStatus('💥 相手が先でした！-1HP', 'damage');
    flashScreen('rgba(239,68,68,.4)');
  }
}

// ═══════════════════════════════════════════════════════
//  Timer
// ═══════════════════════════════════════════════════════
function startTimerBar() {
  const bar = document.getElementById('timer-bar');
  bar.style.setProperty('--dur', TIME_LIMIT + 's');
  bar.className = '';
  void bar.offsetWidth;
  bar.className = 'running';
}

function startTimeoutTimer() {
  clearTimeout(timeoutId);
  timeoutId = setTimeout(() => {
    if (gs.phase !== 'question') return;
    const qIdx = gs.currentQ;
    roundRef.transaction(current => {
      if (current == null) {
        return { winner:'timeout', qIdx, ts: firebase.database.ServerValue.TIMESTAMP };
      }
      return undefined;
    });
  }, TIME_LIMIT * 1000);
}

// ═══════════════════════════════════════════════════════
//  Render
// ═══════════════════════════════════════════════════════
function renderHPs() {
  const h = (n) => '❤️'.repeat(Math.max(0,n)) + '🖤'.repeat(Math.max(0, MAX_HP - n));
  document.getElementById('hearts-p1').textContent = h(gs.p1hp);
  document.getElementById('hearts-p2').textContent = h(gs.p2hp);

  const n1 = document.getElementById('hp-p1-name');
  const n2 = document.getElementById('hp-p2-name');
  n1.className = 'hp-name' + (myRole === 'p1' ? ' me' : '');
  n2.className = 'hp-name' + (myRole === 'p2' ? ' me' : '');
  n1.textContent = myRole === 'p1' ? 'P1（あなた）' : 'P1';
  n2.textContent = myRole === 'p2' ? 'P2（あなた）' : 'P2';

  const total = Math.min(MAX_Q, gs.qIdxList.length);
  document.getElementById('q-counter').textContent = `Q${gs.currentQ + 1}/${total}`;
}

function renderQuestion() {
  if (gs.phase !== 'question') return;
  answered = false;

  const q = currentQ();
  if (!q) return;
  const meta = TYPE_META[q.t] || TYPE_META.vocab;

  document.getElementById('cmd-type').textContent = meta.en;
  document.getElementById('cmd-text').textContent = meta.cmd;

  if (q.t === 'spell') {
    document.getElementById('q-box').textContent  = `「${q.sub}」の英語スペルは？`;
    document.getElementById('q-hint').textContent = q.word.length + '文字';
  } else if (q.t === 'arrange') {
    document.getElementById('q-box').textContent  = q.sub || '単語を正しい順に並べよ！';
    document.getElementById('q-hint').textContent = q.words.length + '語';
  } else {
    document.getElementById('q-box').textContent  = q.q || '';
    document.getElementById('q-hint').textContent = q.sub || q.hint || q.src || '';
  }

  setStatus('⚔️ 先に正解した方が攻撃！', '');

  // Hide all zones
  ['choice','tf','arr','spell'].forEach(z =>
    document.getElementById('zone-' + z).style.display = 'none');
  document.getElementById('zone-' + meta.zone).style.display = '';

  if      (meta.zone === 'choice') renderChoice(q);
  else if (meta.zone === 'tf')     renderTF(q);
  else if (meta.zone === 'arr')    renderArr(q);
  else if (meta.zone === 'spell')  renderSpell(q);
}

// ─── Choice ───
function renderChoice(q) {
  const grid  = document.getElementById('choices-grid');
  const correct = q.ch[q.ans];
  const shuffled = shuffle(q.ch.slice());
  const newAns   = shuffled.indexOf(correct);
  const hasLong  = shuffled.some(c => c.length > 9);
  grid.style.gridTemplateColumns = hasLong ? '1fr' : '1fr 1fr';
  grid.innerHTML = '';
  shuffled.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'cbtn';
    btn.textContent = text;
    btn.onclick = e => choiceAnswer(i, newAns, btn);
    grid.appendChild(btn);
  });
}

function choiceAnswer(idx, ans, btn) {
  if (answered || gs.phase !== 'question') return;
  const ok = idx === ans;
  btn.classList.add(ok ? 'ok' : 'ng');
  if (ok) {
    document.querySelectorAll('.cbtn').forEach(b => b.disabled = true);
    claimRound();
  } else {
    answered = true; // locked out for choice
    btn.disabled = true;
    setStatus('❌ 不正解...相手に期待！', 'damage');
    flashScreen('rgba(239,68,68,.3)');
  }
}

// ─── TF ───
function renderTF(q) {
  const tBtn = document.getElementById('tf-true');
  const fBtn = document.getElementById('tf-false');
  tBtn.className = fBtn.className = 'tfbtn';
  tBtn.disabled  = fBtn.disabled  = false;
  tBtn.onclick = () => tfAnswer(true,  q, tBtn, fBtn);
  fBtn.onclick = () => tfAnswer(false, q, tBtn, fBtn);
}

function tfAnswer(val, q, tBtn, fBtn) {
  if (answered || gs.phase !== 'question') return;
  const ok = val === q.ans;
  (val ? tBtn : fBtn).classList.add(ok ? 'ok' : 'ng');
  if (ok) {
    tBtn.disabled = fBtn.disabled = true;
    claimRound();
  } else {
    answered = true;
    (val ? tBtn : fBtn).disabled = true;
    setStatus('❌ 不正解...相手に期待！', 'damage');
    flashScreen('rgba(239,68,68,.3)');
  }
}

// ─── Arrange ───
function renderArr(q) {
  arrState = { items: [], pool: shuffle(q.words.slice()) };
  renderArrUI(q);
}

function renderArrUI(q) {
  const usedIdxs = new Set(arrState.items.map(x => x.poolIdx));

  // Answer area
  const ans = document.getElementById('arr-ans');
  if (arrState.items.length === 0) {
    ans.innerHTML = '<span class="build-placeholder">単語をタップして並べよう</span>';
  } else {
    ans.innerHTML = '';
    arrState.items.forEach((item, i) => {
      const btn = document.createElement('button');
      btn.className = 'wbtn placed';
      btn.textContent = item.word;
      btn.onclick = () => { arrState.items.splice(i, 1); renderArrUI(q); };
      ans.appendChild(btn);
    });
  }

  // Pool
  const pool = document.getElementById('arr-pool');
  pool.innerHTML = '';
  arrState.pool.forEach((word, pi) => {
    const btn = document.createElement('button');
    btn.className = 'wbtn';
    btn.textContent = word;
    if (usedIdxs.has(pi)) {
      btn.disabled = true;
    } else {
      btn.onclick = () => { arrState.items.push({ word, poolIdx: pi }); renderArrUI(q); };
    }
    pool.appendChild(btn);
  });

  document.getElementById('arr-check').disabled = arrState.items.length < q.words.length;
}

function submitArr() {
  if (answered || gs.phase !== 'question') return;
  const q   = currentQ();
  const ans = arrState.items.map(x => x.word).join(' ');
  if (normStr(ans) === normStr(q.ans)) {
    answered = true;
    disableAllInputs();
    claimRound();
  } else {
    // Wrong: shake + reset answer area, keep pool intact
    const ansEl = document.getElementById('arr-ans');
    ansEl.classList.remove('wrong-shake');
    void ansEl.offsetWidth;
    ansEl.classList.add('wrong-shake');
    arrState.items = [];
    renderArrUI(q);
    setStatus('❌ 順番が違う！もう一度！', 'damage');
    flashScreen('rgba(239,68,68,.3)');
    setTimeout(() => setStatus('⚔️ 先に正解した方が攻撃！', ''), 1200);
  }
}

// ─── Spell ───
function renderSpell(q) {
  spellState = { items: [], pool: shuffle(q.word.split('')) };
  renderSpellUI(q);
}

function renderSpellUI(q) {
  const usedIdxs = new Set(spellState.items.map(x => x.poolIdx));

  const ans = document.getElementById('spell-ans');
  if (spellState.items.length === 0) {
    ans.innerHTML = '<span class="build-placeholder">文字をタップして並べよう</span>';
  } else {
    ans.innerHTML = '';
    spellState.items.forEach((item, i) => {
      const btn = document.createElement('button');
      btn.className = 'lbtn placed';
      btn.textContent = item.letter;
      btn.onclick = () => { spellState.items.splice(i, 1); renderSpellUI(q); };
      ans.appendChild(btn);
    });
  }

  const pool = document.getElementById('spell-pool');
  pool.innerHTML = '';
  spellState.pool.forEach((letter, pi) => {
    const btn = document.createElement('button');
    btn.className = 'lbtn';
    btn.textContent = letter;
    if (usedIdxs.has(pi)) {
      btn.disabled = true;
    } else {
      btn.onclick = () => { spellState.items.push({ letter, poolIdx: pi }); renderSpellUI(q); };
    }
    pool.appendChild(btn);
  });

  document.getElementById('spell-check').disabled = spellState.items.length < q.word.length;
}

function submitSpell() {
  if (answered || gs.phase !== 'question') return;
  const q    = currentQ();
  const word = spellState.items.map(x => x.letter).join('');
  if (word.toLowerCase() === q.word.toLowerCase()) {
    answered = true;
    disableAllInputs();
    claimRound();
  } else {
    const ansEl = document.getElementById('spell-ans');
    ansEl.classList.remove('wrong-shake');
    void ansEl.offsetWidth;
    ansEl.classList.add('wrong-shake');
    spellState.items = [];
    renderSpellUI(q);
    setStatus('❌ スペルが違う！もう一度！', 'damage');
    flashScreen('rgba(239,68,68,.3)');
    setTimeout(() => setStatus('⚔️ 先に正解した方が攻撃！', ''), 1200);
  }
}

// ═══════════════════════════════════════════════════════
//  Result Screen
// ═══════════════════════════════════════════════════════
function showResult() {
  clearTimeout(timeoutId);
  if (gsRef)    gsRef.off();
  if (roundRef) roundRef.off();

  const myHp  = myRole === 'p1' ? gs.p1hp : gs.p2hp;
  const oppHp = myRole === 'p1' ? gs.p2hp : gs.p1hp;

  let emoji, title, msg;
  if      (myHp > oppHp) { emoji = '🏆'; title = '勝利！';   msg = '英語力の勝利！すごい！'; }
  else if (myHp < oppHp) { emoji = '💀'; title = '敗北…';   msg = 'また挑戦しよう！'; }
  else                   { emoji = '🤝'; title = '引き分け！'; msg = 'お互い強かった！'; }

  document.getElementById('r-emoji').textContent  = emoji;
  document.getElementById('r-title').textContent  = title;
  document.getElementById('r-detail').textContent =
    `あなた ❤️${myHp}  vs  ❤️${oppHp} 相手`;
  document.getElementById('r-msg').textContent = msg;
  showScreen('s-result');
}
</script>
</body>
</html>
