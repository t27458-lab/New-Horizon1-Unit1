<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>接続詞 if / when 練習ゲーム</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Segoe UI','Hiragino Sans','Noto Sans JP',sans-serif;background:#f1f5f9;color:#1e293b;min-height:100vh;}
.screen{display:none;padding:1rem;max-width:680px;margin:0 auto;}
.screen.active{display:block;}

/* ===== レベル選択 ===== */
.game-title{text-align:center;padding:2rem 0 1rem;font-size:1.5rem;font-weight:900;color:#0f172a;}
.game-subtitle{text-align:center;color:#64748b;font-size:.9rem;margin-bottom:1.5rem;}
.lv-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:.8rem;margin:1rem 0;}
.lv-card{background:#fff;border:2px solid #e2e8f0;border-radius:16px;padding:1.2rem .8rem;text-align:center;cursor:pointer;transition:all .18s;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.lv-card:hover{border-color:#6366f1;transform:translateY(-3px);box-shadow:0 6px 18px rgba(99,102,241,.2);}
.lv-icon{font-size:2rem;margin-bottom:.4rem;}
.lv-name{font-weight:800;font-size:.95rem;}
.lv-desc{font-size:.75rem;color:#64748b;margin-top:.3rem;}
.level-strip{background:#fff;border-radius:12px;padding:.8rem 1rem;margin-bottom:1rem;display:flex;align-items:center;gap:.8rem;font-size:.85rem;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.level-bar-wrap{flex:1;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;}
#level-bar{height:100%;background:#6366f1;border-radius:4px;transition:width .5s;}

/* ===== スタート画面 ===== */
.section-tabs{display:flex;gap:.5rem;margin-bottom:1rem;}
.tab-btn{flex:1;padding:.6rem;border:2px solid #e2e8f0;border-radius:12px;background:#fff;font-size:.85rem;font-weight:700;cursor:pointer;transition:all .15s;}
.tab-btn.active{border-color:#6366f1;background:#6366f1;color:#fff;}
.tab-when.active{border-color:#10b981;background:#10b981;}
.tab-if.active{border-color:#f59e0b;background:#f59e0b;}
.tab-combined.active{border-color:#6366f1;background:#6366f1;}
.badge-info{text-align:center;font-size:.85rem;color:#475569;margin-bottom:.8rem;}
.mode-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.6rem;margin-bottom:1rem;}
.mc{background:#fff;border:2px solid #e2e8f0;border-radius:14px;padding:.8rem;cursor:pointer;transition:all .15s;text-align:center;}
.mc:hover{border-color:#6366f1;background:#f0f4ff;}
.mc.sel{border-color:#6366f1;background:#eef2ff;}
.mc-icon{font-size:1.4rem;}
.mc-name{font-size:.8rem;font-weight:700;margin:.2rem 0;}
.mc-cnt{font-size:.75rem;color:#64748b;}
.start-btn{width:100%;padding:.9rem;background:#6366f1;color:#fff;border:none;border-radius:14px;font-size:1.1rem;font-weight:800;cursor:pointer;transition:background .15s;margin-top:.5rem;}
.start-btn:hover{background:#4f46e5;}

/* ===== クイズ画面 ===== */
.prog-wrap{background:#e2e8f0;height:6px;border-radius:3px;margin-bottom:.6rem;}
#prog{height:100%;background:#10b981;border-radius:3px;transition:width .3s;}
.prog-num{font-size:.8rem;color:#64748b;text-align:right;margin-bottom:.4rem;}
.score-live-wrap{text-align:right;font-size:.9rem;color:#475569;margin-bottom:.4rem;}
.combo-display{text-align:center;font-weight:800;color:#f59e0b;font-size:1rem;min-height:1.4rem;transition:all .2s;}
.combo-display.show{display:block;}
.combo-display:not(.show){display:none;}
.combo-fire{font-size:1.1rem;}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.combo-display.pop{animation:pop .25s ease;}
.tag-area{margin-bottom:.4rem;}
.tag{display:inline-block;padding:.2rem .6rem;border-radius:20px;font-size:.75rem;font-weight:700;}
.tb{background:#dbeafe;color:#1d4ed8;}
.te{background:#fee2e2;color:#b91c1c;}
.tw{background:#fef9c3;color:#854d0e;}
.ts{background:#f3e8ff;color:#7e22ce;}
.tt{background:#dcfce7;color:#15803d;}
.tja{background:#ffedd5;color:#c2410c;}
.tdl{background:#e0f2fe;color:#0369a1;}
.typ{background:#fce7f3;color:#9d174d;}
.tpc{background:#f1f5f9;color:#475569;}
.tib{background:#d1fae5;color:#065f46;}
.tie{background:#fde68a;color:#92400e;}
.tis{background:#ede9fe;color:#5b21b6;}
.tit{background:#cffafe;color:#0e7490;}
.tija{background:#fef3c7;color:#78350f;}
.tidl{background:#e0f2fe;color:#075985;}
.tityp{background:#fdf2f8;color:#86198f;}
.tipc{background:#f8fafc;color:#64748b;}
.tcw{background:#d1fae5;color:#065f46;}
.tci{background:#fef3c7;color:#92400e;}
.tcm{background:#f3e8ff;color:#6d28d9;}
.ctx-box{background:#f8fafc;border-left:3px solid #6366f1;padding:.6rem .8rem;border-radius:0 8px 8px 0;margin-bottom:.6rem;font-size:.88rem;}
.ctx-label{font-size:.75rem;font-weight:700;color:#6366f1;margin-bottom:.3rem;}
.q-card{background:#fff;border-radius:16px;padding:1.2rem;margin-bottom:.8rem;box-shadow:0 2px 12px rgba(0,0,0,.07);}
.q-text{font-size:1.05rem;font-weight:700;line-height:1.6;margin-bottom:.5rem;}
.q-sub{background:#f0fdf4;border-radius:8px;padding:.5rem .7rem;font-size:.85rem;color:#166534;margin-bottom:.5rem;}
.dialog-box{background:#f0f9ff;border-radius:10px;padding:.7rem 1rem;font-size:.9rem;white-space:pre-line;margin-bottom:.5rem;line-height:1.7;}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:.5rem;}
.choices.two{grid-template-columns:1fr 1fr;}
.c-btn{background:#f8fafc;border:2px solid #e2e8f0;border-radius:12px;padding:.7rem .5rem;font-size:.88rem;cursor:pointer;transition:all .15s;font-weight:600;}
.c-btn:hover:not(:disabled){background:#eef2ff;border-color:#6366f1;}
.c-btn.correct{background:#dcfce7;border-color:#16a34a;color:#15803d;}
.c-btn.wrong{background:#fee2e2;border-color:#dc2626;color:#b91c1c;}
.al{font-size:.8rem;font-weight:700;color:#475569;margin-bottom:.4rem;}
.ans-area{min-height:44px;background:#f1f5f9;border:2px dashed #cbd5e1;border-radius:10px;padding:.4rem;display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.6rem;}
.pool-area{display:flex;flex-wrap:wrap;gap:.3rem;margin-bottom:.8rem;}
.w-btn{background:#e0e7ff;border:none;border-radius:8px;padding:.35rem .6rem;font-size:.85rem;font-weight:600;cursor:pointer;color:#3730a3;}
.w-btn.aw{background:#818cf8;color:#fff;}
.w-btn.used{opacity:.3;cursor:not-allowed;}
.w-btn:disabled{opacity:.5;cursor:not-allowed;}
.check-btn,.submit-btn{width:100%;padding:.7rem;background:#6366f1;color:#fff;border:none;border-radius:12px;font-size:.95rem;font-weight:700;cursor:pointer;margin-top:.3rem;}
.check-btn:hover,.submit-btn:hover{background:#4f46e5;}
.typing-input{width:100%;padding:.7rem .9rem;border:2px solid #cbd5e1;border-radius:12px;font-size:1rem;margin-bottom:.6rem;outline:none;}
.typing-input:focus{border-color:#6366f1;}
.typing-input.correct{border-color:#16a34a;background:#f0fdf4;}
.typing-input.wrong{border-color:#dc2626;background:#fff1f2;}
.fb{padding:.7rem .9rem;border-radius:12px;font-size:.92rem;font-weight:600;margin:.6rem 0;display:none;}
.fb.show{display:block;}
.fb.ok{background:#dcfce7;color:#166534;}
.fb.ng{background:#fee2e2;color:#991b1b;}
.fb.timeout{background:#fef9c3;color:#854d0e;}
.pts-flash{font-weight:800;color:#f59e0b;margin-left:.4rem;}
.ex-box{background:#fff7ed;border-left:3px solid #f59e0b;padding:.5rem .7rem;border-radius:0 8px 8px 0;margin-top:.5rem;font-size:.83rem;color:#78350f;font-weight:500;}
.next-btn{display:none;width:100%;padding:.8rem;background:#10b981;color:#fff;border:none;border-radius:14px;font-size:1rem;font-weight:800;cursor:pointer;margin-top:.5rem;}
.next-btn.show{display:block;}
.next-btn:hover{background:#059669;}

/* ===== 結果画面 ===== */
.result-card{background:#fff;border-radius:20px;padding:1.5rem;margin-bottom:1rem;text-align:center;box-shadow:0 4px 16px rgba(0,0,0,.08);}
.res-rank{font-size:3.5rem;margin-bottom:.3rem;}
.res-pts-wrap{font-size:2.8rem;font-weight:900;color:#1e293b;}
.res-denom{font-size:1.2rem;color:#64748b;}
.res-pct{font-size:1.1rem;font-weight:700;color:#6366f1;margin:.3rem 0;}
.res-msg{font-size:.95rem;color:#475569;}
.lvup-banner{background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-radius:12px;padding:.7rem 1rem;text-align:center;font-weight:800;font-size:.95rem;margin-bottom:.8rem;display:none;}
.lvup-banner.show{display:block;}
.bd-section{background:#fff;border-radius:14px;padding:1rem;margin-bottom:1rem;box-shadow:0 2px 8px rgba(0,0,0,.06);}
.bd-title{font-size:.85rem;font-weight:800;color:#475569;margin-bottom:.7rem;}
.bd-row{display:flex;align-items:center;gap:.5rem;margin-bottom:.4rem;}
.bd-tag{display:inline-block;padding:.15rem .5rem;border-radius:20px;font-size:.72rem;font-weight:700;white-space:nowrap;}
.bar-wrap{flex:1;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;}
.bar-fill{height:100%;border-radius:4px;transition:width .6s;}
.bd-score{font-size:.8rem;font-weight:700;min-width:2.5rem;text-align:right;}
.badge-item{display:inline-block;background:#f1f5f9;border-radius:20px;padding:.25rem .6rem;font-size:.8rem;margin:.2rem;}
.badge-item.new-badge{background:#fef9c3;font-weight:800;}
.result-btns{display:grid;grid-template-columns:1fr 1fr;gap:.6rem;}
.retry-btn{padding:.8rem;background:#6366f1;color:#fff;border:none;border-radius:12px;font-size:.9rem;font-weight:700;cursor:pointer;}
.home-btn{padding:.8rem;background:#fff;color:#6366f1;border:2px solid #6366f1;border-radius:12px;font-size:.9rem;font-weight:700;cursor:pointer;}
.badge-popup{position:fixed;bottom:1.5rem;left:50%;transform:translateX(-50%);background:#1e293b;color:#fbbf24;padding:.6rem 1.2rem;border-radius:20px;font-weight:800;font-size:.88rem;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9998;}
.badge-popup.show{opacity:1;}
</style>
</head>
<body>

<!-- ===== レベル選択 ===== -->
<div class="screen active" id="sc-level">
  <div class="level-strip">
    <span id="level-info">Lv.1 見習い　XP: 0</span>
    <div class="level-bar-wrap"><div id="level-bar" style="width:0%"></div></div>
  </div>
  <div class="game-title">接続詞 if / when 練習ゲーム</div>
  <div class="game-subtitle">中学2年生 英文法ドリル</div>
  <div class="lv-grid">
    <div class="lv-card" data-level="basic">
      <div class="lv-icon">🌱</div>
      <div class="lv-name">初級者編</div>
      <div class="lv-desc">選択・並べ替えで練習</div>
    </div>
    <div class="lv-card" data-level="mid">
      <div class="lv-icon">🔥</div>
      <div class="lv-name">中級者編</div>
      <div class="lv-desc">タイピングも含む</div>
    </div>
    <div class="lv-card" data-level="adv">
      <div class="lv-icon">⭐</div>
      <div class="lv-name">上級者編</div>
      <div class="lv-desc">スピード＆正確さ勝負</div>
    </div>
  </div>
</div>

<!-- ===== スタート画面 ===== -->
<div class="screen" id="sc-start">
  <div style="display:flex;align-items:center;gap:.5rem;margin-bottom:.8rem;">
    <button onclick="showSc('level')" style="background:none;border:none;font-size:1.2rem;cursor:pointer;">←</button>
    <span style="font-weight:800;font-size:1rem;">モードを選んでください</span>
  </div>
  <!-- タブ -->
  <div class="section-tabs">
    <button class="tab-btn tab-when active" id="tab-when" onclick="switchTab('when')">⏰ when</button>
    <button class="tab-btn tab-if" id="tab-if" onclick="switchTab('if')">🤔 if</button>
    <button class="tab-btn tab-combined" id="tab-combined" onclick="switchTab('combined')">🔀 if と when 総合</button>
  </div>
  <div class="badge-info" id="badge-info"></div>
  <div class="mode-grid" id="mode-grid"></div>
  <button class="start-btn" id="start-btn">スタート ▶</button>
</div>

<!-- ===== クイズ画面 ===== -->
<div class="screen" id="sc-quiz">
  <div class="prog-wrap"><div id="prog" style="width:0%"></div></div>
  <div class="prog-num" id="prog-num">1 / 1</div>
  <div class="score-live-wrap" id="score-live-wrap">現在の得点：<b id="score-live">0</b> 点</div>
  <div class="combo-display" id="combo-display"></div>
  <div class="tag-area" id="tag-area"></div>
  <div id="ctx-area"></div>
  <div class="q-card">
    <div class="q-text" id="q-text"></div>
    <div id="q-sub-area"></div>
    <div id="q-img-area"></div>
    <div id="q-body"></div>
  </div>
  <div class="fb" id="fb"></div>
  <button class="next-btn" id="next-btn">次の問題へ ▶</button>
</div>

<!-- ===== 結果画面 ===== -->
<div class="screen" id="sc-result">
  <div class="lvup-banner" id="lvup-banner"></div>
  <div class="result-card">
    <div class="res-rank" id="res-rank">🥇</div>
    <div class="res-pts-wrap">
      <span id="res-pts">0</span><span class="res-denom" id="res-denom"> 点</span>
    </div>
    <div class="res-pct" id="res-pct"></div>
    <div class="res-msg" id="res-msg"></div>
  </div>
  <div class="bd-section">
    <div class="bd-title">📊 カテゴリ別結果</div>
    <div id="res-bd"></div>
  </div>
  <div id="res-badges" style="margin-bottom:1rem;"></div>
  <div class="result-btns">
    <button class="retry-btn" id="retry-btn">もう一度 🔄</button>
    <button class="home-btn" id="home-btn">ホームへ 🏠</button>
  </div>
</div>

<script src="questions_when.js"></script>
<script src="questions_if.js"></script>
<script src="questions_if_when.js"></script>
<script src="game_engine.js"></script>
</body>
</html>
