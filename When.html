<title>接続詞 when 練習ゲーム</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;background:#f0f4ff;min-height:100vh;padding:1rem .75rem;display:flex;justify-content:center}#app{width:100%;max-width:640px}.card{background:#fff;border-radius:18px;padding:1.5rem;box-shadow:0 2px 20px rgba(0,0,0,.1);margin-bottom:1rem}.screen{display:none}.screen.active{display:block}.timer-wrap{margin-bottom:.75rem}.timer-bar-bg{height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden;margin-bottom:4px}.timer-bar{height:8px;border-radius:4px;transition:width .1s linear,background .5s}.timer-num{font-size:13px;font-weight:800;text-align:right;color:#10b981}.prog-outer{display:flex;align-items:center;gap:10px;margin-bottom:.5rem}.prog-wrap{flex:1;height:8px;background:#e2e8f0;border-radius:4px;overflow:hidden}.prog-bar{height:8px;background:linear-gradient(90deg,#10b981,#3b82f6);border-radius:4px;transition:width .4s}.prog-num{font-size:13px;font-weight:800;color:#10b981;white-space:nowrap}.score-live{font-size:13px;color:#64748b;text-align:right;margin-bottom:.5rem}.score-live b{color:#059669;font-size:15px}.tag{display:inline-flex;font-size:12px;font-weight:700;padding:4px 12px;border-radius:20px;margin-bottom:.75rem}.tv{background:#dbeafe;color:#1d4ed8}.tb{background:#d1fae5;color:#065f46}.tw{background:#fef3c7;color:#92400e}.ts{background:#ede9fe;color:#5b21b6}.tc{background:#fce7f3;color:#9d174d}.tp{background:#e0f2fe;color:#0369a1}.tf2{background:#ffedd5;color:#9a3412}.tt{background:#f0fdf4;color:#166534}.te{background:#fee2e2;color:#991b1b}.tja{background:#fdf4ff;color:#7e22ce}.tdl{background:#ffe4e6;color:#9f1239}.tcm{background:#fff7ed;color:#c2410c}.tmr{background:#ecfdf5;color:#065f46}.tst{background:#f0f9ff;color:#0c4a6e}.tpc{background:#faf5ff;color:#6b21a8}.typ{background:#fef9c3;color:#713f12}.ctx-box{background:#f0f9ff;border:1.5px solid #bae6fd;border-radius:10px;padding:.6rem 1rem;margin-bottom:.75rem;font-size:14px;font-weight:700;color:#0369a1;line-height:1.5}.ctx-label{font-size:11px;font-weight:800;color:#64748b;margin-bottom:3px}.q-text{font-size:18px;font-weight:700;color:#1e293b;margin-bottom:.5rem;line-height:1.6;white-space:pre-wrap}.q-sub{font-size:13px;color:#475569;margin-bottom:1rem;line-height:1.6;background:#f8fafc;padding:.5rem .75rem;border-radius:8px;border-left:3px solid #94a3b8}.dialog-box{background:#eff6ff;border:1.5px solid #93c5fd;border-radius:12px;padding:.75rem 1rem;margin-bottom:.75rem;font-size:15px;line-height:1.9;white-space:pre-wrap;color:#1e293b}.q-ref{font-size:12px;color:#64748b;margin-bottom:.5rem;font-style:italic}.q-img{width:100%;border-radius:10px;margin-bottom:1rem;border:1.5px solid #e2e8f0}.choices{display:grid;gap:9px;margin-bottom:.75rem}.two{grid-template-columns:1fr 1fr}.c-btn{width:100%;padding:.75rem 1rem;background:#fff;border:1.5px solid #cbd5e1;border-radius:10px;cursor:pointer;font-size:14px;color:#1e293b;text-align:left;transition:border-color .15s,background .15s;font-family:inherit;line-height:1.45}.c-btn:hover{background:#f0f7ff;border-color:#10b981}.c-btn.correct{background:#d1fae5;border-color:#059669;color:#064e3b;font-weight:700}.c-btn.wrong{background:#fee2e2;border-color:#dc2626;color:#7f1d1d}.c-btn:disabled{cursor:default}.c-btn:disabled:not(.correct):not(.wrong){opacity:.7}.tf-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:.75rem}.tf-btn{padding:1.2rem;border:1.5px solid #cbd5e1;border-radius:12px;cursor:pointer;font-size:18px;font-weight:800;text-align:center;background:#fff;transition:background .15s;font-family:inherit}.tf-btn.correct{background:#d1fae5;border-color:#059669;color:#064e3b}.tf-btn.wrong{background:#fee2e2;border-color:#dc2626;color:#7f1d1d}.al{font-size:12px;color:#64748b;margin-bottom:4px;font-weight:700}.ans-area{display:flex;flex-wrap:wrap;gap:7px;min-height:50px;padding:10px;border:2px dashed #94a3b8;border-radius:10px;margin-bottom:.75rem;background:#f8fafc}.pool-area{display:flex;flex-wrap:wrap;gap:7px;min-height:44px;margin-bottom:.75rem}.w-btn{padding:7px 14px;background:#fff;border:1.5px solid #94a3b8;border-radius:8px;cursor:pointer;font-size:14px;color:#1e293b;font-family:inherit;font-weight:600;transition:background .15s}.w-btn:hover:not([disabled]){background:#f0f7ff;border-color:#10b981}.w-btn.used{opacity:.22;pointer-events:none}.w-btn.aw{background:#dbeafe;border-color:#10b981;color:#1e40af;font-weight:700}.check-btn{width:100%;padding:.8rem;background:#10b981;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:.75rem;font-family:inherit}.check-btn:disabled{opacity:.45;cursor:default}.typing-input{width:100%;padding:.85rem 1rem;border:2px solid #cbd5e1;border-radius:10px;font-size:16px;font-family:inherit;color:#1e293b;margin-bottom:.75rem;outline:none;transition:border-color .15s}.typing-input:focus{border-color:#10b981}.typing-input.correct{border-color:#059669;background:#f0fdf4}.typing-input.wrong{border-color:#dc2626;background:#fff1f2}.submit-btn{width:100%;padding:.8rem;background:#10b981;border:none;border-radius:10px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;margin-bottom:.75rem;font-family:inherit}.submit-btn:disabled{opacity:.45;cursor:default}.fb{padding:.8rem 1rem;border-radius:10px;margin-bottom:.75rem;font-size:14px;font-weight:600;display:none;line-height:1.6}.fb.show{display:block}.fb.ok{background:#d1fae5;color:#064e3b;border:1.5px solid #059669}.fb.ng{background:#fee2e2;color:#7f1d1d;border:1.5px solid #dc2626}.fb.timeout{background:#fff7ed;color:#9a3412;border:1.5px solid #fcd34d}.next-btn{width:100%;padding:.8rem;background:#f1f5f9;border:1.5px solid #e2e8f0;border-radius:10px;color:#1e293b;font-size:15px;cursor:pointer;display:none;font-family:inherit;font-weight:700}.next-btn.show{display:block}.next-btn:hover{background:#e2e8f0}.app-logo{font-size:11px;font-weight:800;color:#fff;background:#10b981;display:inline-block;padding:3px 10px;border-radius:6px;margin-bottom:.75rem}.app-title{font-size:24px;font-weight:900;color:#1e293b;margin-bottom:.2rem}.app-sub{font-size:13px;color:#64748b;margin-bottom:1rem}.badge-100{display:inline-block;background:linear-gradient(135deg,#10b981,#3b82f6);color:#fff;font-size:13px;font-weight:900;padding:4px 14px;border-radius:20px;margin-bottom:1rem}.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:1rem}.mc{padding:.75rem .6rem;border:1.5px solid #e2e8f0;border-radius:12px;cursor:pointer;transition:all .15s;background:#fff;text-align:center}.mc:hover{border-color:#10b981;background:#f0f7ff}.mc.sel{border-color:#10b981;background:#dbeafe}.mc-icon{font-size:18px;display:block;margin-bottom:3px}.mc-name{font-size:11px;font-weight:800;color:#1e293b;line-height:1.3}.mc-cnt{font-size:10px;color:#64748b;margin-top:2px}.start-btn{width:100%;padding:1rem;background:#10b981;border:none;border-radius:12px;color:#fff;font-size:18px;font-weight:900;cursor:pointer;font-family:inherit;box-shadow:0 4px 14px rgba(0,0,0,.18)}.start-btn:hover{filter:brightness(1.08)}.result-hero{text-align:center;padding:1rem 0 .75rem}.result-pts{font-size:80px;font-weight:900;line-height:1;color:#10b981;display:inline}.result-denom{font-size:28px;font-weight:700;color:#64748b}.result-pct{font-size:20px;font-weight:800;margin-top:.5rem;color:#1e293b}.result-msg{font-size:14px;color:#475569;margin:.5rem auto 0;line-height:1.5;max-width:320px}.rank-icon{font-size:44px;display:block;margin-bottom:.25rem}.bd-hd{font-size:13px;font-weight:800;color:#475569;margin:1rem 0 .5rem;padding-bottom:.25rem;border-bottom:2px solid #e2e8f0}.bd-row{display:flex;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9;gap:8px}.bd-row:last-child{border-bottom:none}.bd-tag{font-size:11px;font-weight:700;padding:2px 7px;border-radius:12px;white-space:nowrap}.bar-wrap{flex:1;height:6px;background:#e2e8f0;border-radius:3px;overflow:hidden}.bar-fill{height:6px;border-radius:3px}.bd-score{font-size:13px;font-weight:800;white-space:nowrap;min-width:40px;text-align:right}.retry-btn{width:100%;padding:.9rem;background:#10b981;border:none;border-radius:12px;color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:1.25rem;box-shadow:0 4px 14px rgba(0,0,0,.15)}.home-btn{width:100%;padding:.8rem;background:#f1f5f9;border:1.5px solid #e2e8f0;border-radius:12px;color:#1e293b;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-top:.5rem}.ex-box{margin-top:.5rem;padding:.6rem .85rem;background:#fffbeb;border:1.5px solid #fcd34d;border-radius:8px;font-size:13px;color:#78350f;font-weight:600;line-height:1.7}
/* ===== GAME FEATURES ===== */
#combo-display{display:none;font-size:13px;font-weight:800;text-align:right;margin-bottom:.4rem;color:#f59e0b;transition:all .2s}
#combo-display.show{display:block}
#combo-display.pop{animation:comboPop .35s ease}
@keyframes comboPop{0%{transform:scale(1)}50%{transform:scale(1.45)}100%{transform:scale(1)}}
.combo-fire{display:inline-block;animation:fireWiggle .3s infinite alternate}
@keyframes fireWiggle{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}
.badge-popup{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(80px);background:#1e293b;color:#fff;border-radius:16px;padding:12px 22px;font-size:14px;font-weight:700;z-index:9999;opacity:0;transition:all .5s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 20px rgba(0,0,0,.3)}
.badge-popup.show{opacity:1;transform:translateX(-50%) translateY(0)}
#level-bar-wrap{background:#f1f5f9;border-radius:10px;height:10px;margin:.5rem 0 .3rem;overflow:hidden}
#level-bar{height:10px;border-radius:10px;background:linear-gradient(90deg,#6366f1,#8b5cf6);transition:width .6s ease}
#level-info{font-size:13px;color:#475569;font-weight:700;margin-bottom:.6rem}
.level-up-banner{display:none;background:linear-gradient(135deg,#6366f1,#8b5cf6);color:#fff;border-radius:14px;padding:.9rem 1.2rem;margin-bottom:1rem;font-weight:800;font-size:16px;text-align:center;animation:bannerIn .5s ease}
.level-up-banner.show{display:block}
@keyframes bannerIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
#res-badges{margin-top:.8rem}
.badge-item{display:inline-flex;align-items:center;gap:6px;background:#fef3c7;border:1.5px solid #fcd34d;border-radius:10px;padding:5px 12px;margin:4px;font-size:13px;font-weight:700;color:#92400e}
.badge-item.new-badge{background:#d1fae5;border-color:#6ee7b7;color:#064e3b;animation:badgePop .5s ease}
@keyframes badgePop{0%{transform:scale(0)}70%{transform:scale(1.15)}100%{transform:scale(1)}}

.level-grid{display:flex;flex-direction:column;gap:10px;margin:1rem 0 .5rem;}
.lv-card{padding:1rem 1.2rem;border:2px solid #e2e8f0;border-radius:14px;cursor:pointer;transition:all .15s;background:#fff;display:flex;align-items:center;gap:14px;}
.lv-card:hover{border-color:#10b981;background:#f0fdf4;transform:translateY(-1px);box-shadow:0 4px 12px rgba(16,185,129,.12);}
.lv-icon{font-size:2rem;line-height:1;}
.lv-name{font-size:17px;font-weight:900;color:#1e293b;margin-bottom:2px;}
.lv-desc{font-size:12px;color:#64748b;}
.lv-arrow{margin-left:auto;color:#94a3b8;font-size:1.1rem;font-weight:700;}

.pts-flash{display:inline-block;font-size:15px;font-weight:900;color:#f59e0b;margin-left:6px;animation:ptsPop .4s ease;}
@keyframes ptsPop{0%{transform:scale(1.5);opacity:0}100%{transform:scale(1);opacity:1}}
.pts-label{font-size:11px;font-weight:800;color:#059669;vertical-align:middle;margin-left:2px;}
.result-pts-pts{font-size:32px;font-weight:700;color:#64748b;display:inline;}
</style>
<style>#timer-wrap,#timer-bar,#timer-num,.timer-area,[id^="timer"]{ display:none !important; }</style>

<body><div id="app"><div id="sc-level" class="screen active"><div class="card"><div class="app-logo">中2英語 · 接続詞</div><div class="app-title">when 練習ゲーム</div><div class="app-sub" style="margin-bottom:1rem">レベルを選んでください</div><div class="level-grid"><div class="lv-card" data-level="basic"><span class="lv-icon">🌱</span><div><div class="lv-name">練習モード</div><div class="lv-desc">when の基本をマスター</div></div><span class="lv-arrow">▶</span></div><div class="lv-card" data-level="mid"><span class="lv-icon">🔥</span><div><div class="lv-name">チャレンジ</div><div class="lv-desc">並べ替え・誤り指摘に挑戦</div></div><span class="lv-arrow">▶</span></div><div class="lv-card" data-level="adv"><span class="lv-icon">⭐</span><div><div class="lv-name">タイピング</div><div class="lv-desc">英文を丸ごと書いてみよう</div></div><span class="lv-arrow">▶</span></div></div></div></div><div id="sc-start" class="screen"><div class="card"><div class="app-logo">中2英語 · 接続詞</div><div class="app-title">when 練習ゲーム</div><div class="app-sub">空欄補充・並べ替え・誤り指摘・タイピング ⏱️時間制限あり</div><div class="badge-100" id="badge-info">📖 接続詞 when を完全マスター！</div><div id="level-info">Lv.1 見習い　XP: 0</div><div id="level-bar-wrap"><div id="level-bar" style="width:0%"></div></div><div style="font-size:13px;font-weight:800;color:#475569;margin-bottom:.6rem">モードを選んでください</div><div class="mode-grid" id="mode-grid"></div><button class="start-btn" id="start-btn">スタート ▶</button></div></div><div id="sc-quiz" class="screen"><div class="card"><div class="prog-outer"><div class="prog-wrap"><div class="prog-bar" id="prog"></div></div><div class="prog-num" id="prog-num"></div></div><div class="score-live" id="score-live-wrap">現在の得点：<b id="score-live">0</b> 点</div><div id="combo-display"></div><div class="timer-wrap"><div class="timer-bar-bg"><div class="timer-bar" id="timer-bar" style="width:100%;background:#10b981"></div></div><div class="timer-num" id="timer-num">-- 秒</div></div><div id="tag-area"></div><div id="ctx-area"></div><div class="q-text" id="q-text"></div><div id="q-sub-area"></div><div id="q-img-area"></div><div id="q-body"></div><div class="fb" id="fb"></div><button class="next-btn" id="next-btn">次の問題へ ▶</button></div></div><div id="sc-result" class="screen"><div class="card"><div class="result-hero"><span class="rank-icon" id="res-rank"></span><div><span class="result-pts" id="res-pts"></span><span class="result-denom" id="res-denom"> / 100点</span></div><div class="result-pct" id="res-pct"></div><div class="result-msg" id="res-msg"></div></div><div class="bd-hd">ジャンル別結果</div><div id="res-bd"></div><div class="level-up-banner" id="lvup-banner"></div><div id="res-badges"></div><button class="retry-btn" id="retry-btn">🔁 もう一度チャレンジ</button><button class="home-btn" id="home-btn">🏠 モード選択に戻る</button></div></div></div>
